function pad(n) { return n < 10 ? '0' + n : String(n); }
function initialsOf(t) {
  return String(t || '').trim().split(/\s+/).slice(0, 2).map(w => w.charAt(0)).join('').toUpperCase() || '▶';
}
function posterBg(i) {
  const p = POSTERS[i % POSTERS.length];
  return `linear-gradient(160deg, ${p[0]}, ${p[1]})`;
}
function fmtTime(sec) {
  const s = Math.max(0, Math.floor(sec || 0));
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${pad(h)}:${pad(m % 60)}:${pad(s % 60)}`;
  return `${pad(m)}:${pad(s % 60)}`;
}
function fmtBytes(mb) {
  const v = Number(mb || 0);
  return v >= 1024 ? (v / 1024).toFixed(2) + ' GB' : v.toFixed(1) + ' MB';
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function parseSpec(spec, serials) {
  const avail = new Set(serials);
  const norm = String(spec || '').trim().replace(/\s*-\s*/g, '-');
  if (!norm) return null;
  if (['all', '*', 'tất cả'].includes(norm.toLowerCase())) {
    return new Set(serials);
  }
  const out = new Set();
  const parts = norm.split(/[,;\s]+/);
  for (const part of parts) {
    if (!part) continue;
    const m = part.match(/^(\d+)-(\d+)$/);
    if (m) {
      let a = parseInt(m[1], 10), b = parseInt(m[2], 10);
      if (a > b) { const t = a; a = b; b = t; }
      for (let n = a; n <= b; n++) if (avail.has(n)) out.add(n);
    } else if (/^\d+$/.test(part)) {
      const n = parseInt(part, 10);
      if (avail.has(n)) out.add(n);
    } else {
      return null;
    }
  }
  return out;
}

async function api(path, body = null) {
  const opts = body !== null
    ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    : { method: 'GET' };
  const res = await fetch(path, opts);
  return await res.json();
}

            <select onchange="state.mergeSubMode=this.value;render()" style="height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid ${c.line}; background: ${c.input}; color: ${c.text}; font-size: 13px; font-weight: 600">
              <option value="soft" ${state.mergeSubMode === 'soft' ? 'selected' : ''}>⚡ Có ghép Sub — Nhúng Soft-Sub vào MP4 + Xuất .SRT/.VTT (Siêu tốc Stream Copy)</option>
              <option value="hard" ${state.mergeSubMode === 'hard' ? 'selected' : ''}>🔥 Có ghép Sub — Đốt cứng chữ Phụ đề bằng VGA/GPU (Hard-Sub NVENC)</option>
              <option value="none" ${state.mergeSubMode === 'none' ? 'selected' : ''}>🚫 Không ghép Sub — Chỉ nối Video + Âm thanh (Siêu tốc Stream Copy)</option>
            </select>
          </div>

          <button onclick="runStandaloneMerge()" ${state.merging ? 'disabled' : ''} style="height: 42px; border-radius: 10px; border: 1px solid ${c.accent}; background: ${c.accent}; color: ${c.accentInk}; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: ${state.merging ? '0.6' : '1'}">
            ⚡ ${state.merging ? `Đang ghép (${state.mergePct || 0}%)…` : 'Ghép Tập Dài Ngay'}
          </button>
        </div>

        <!-- THANH TIẾN TRÌNH GHÉP VIDEO THỜI GIAN THỰC -->
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: ${c.panel2}; border: 1px solid ${state.merging ? c.accent : c.line}">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
            <div style="display: flex; align-items: center; gap: 8px; min-width: 0">
              <span style="width: 9px; height: 9px; border-radius: 50%; background: ${state.merging ? c.warn : (state.mergePct === 100 ? c.ok : c.muted)}; flex: 0 0 auto"></span>
              <span style="font-size: 13px; font-weight: 600; color: ${c.text}">${esc(state.mergeStatus)}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 12px">
              ${state.mergeBatchTotal > 0 ? `<span style="padding: 3px 8px; border-radius: 6px; background: ${c.panel}; color: ${c.muted}">Tập dài ${state.mergeBatchIdx}/${state.mergeBatchTotal}</span>` : ''}
              ${state.mergeTotSec > 0 ? `<span style="padding: 3px 8px; border-radius: 6px; background: ${c.panel}; color: ${c.text}">⏱ ${fmtTime(state.mergeCurSec)} / ${fmtTime(state.mergeTotSec)}</span>` : ''}
              ${state.mergeSpeed && state.mergeSpeed !== '—' ? `<span style="padding: 3px 8px; border-radius: 6px; background: ${c.accentSoft}; color: ${c.accentText}; font-weight: 700">⚡ Tốc độ ${esc(state.mergeSpeed)}</span>` : ''}
              ${state.mergeFps && state.mergeFps !== '—' && state.mergeFps !== '0.0' ? `<span style="padding: 3px 8px; border-radius: 6px; background: ${c.infoSoft}; color: ${c.info}; font-weight: 700">${esc(state.mergeFps)} FPS</span>` : ''}
              ${state.mergeSizeMb > 0 ? `<span style="padding: 3px 8px; border-radius: 6px; background: ${c.panel}; color: ${c.muted}">${Number(state.mergeSizeMb).toFixed(1)} MB</span>` : ''}
              <span style="padding: 3px 9px; border-radius: 6px; background: ${state.mergePct === 100 ? c.okSoft : c.accentSoft}; color: ${state.mergePct === 100 ? c.ok : c.accentText}; font-weight: 800; font-size: 13px">${state.mergePct || 0}%</span>
            </div>
          </div>
          <div aria-hidden="true" style="height: 10px; border-radius: 999px; background: ${c.track}; overflow: hidden">
            <div style="height: 100%; width: ${Math.max(0, Math.min(100, state.mergePct || 0))}%; background: ${state.mergePct === 100 ? c.ok : c.accent}; border-radius: 999px; transition: width 0.2s ease"></div>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: ${c.muted}">
            <span>Engine đang dùng: <strong style="color: ${c.text}; font-family: 'JetBrains Mono', monospace">${esc(state.mergeEngine || state.gpuLabel)}</strong></span>
            ${curFolderObj ? `<span style="font-family: 'JetBrains Mono', monospace; color: ${c.accentText}">Thư mục đang chọn có ${curFolderObj.ep_count} tập (Tập ${pad(curFolderObj.ep_min)} → Tập ${pad(curFolderObj.ep_max)}) · ${curFolderObj.sub_count} file phụ đề</span>` : ''}
          </div>
        </div>

        ${mergeResultsHtml}
      </section>

      <section aria-label="Hàng đợi đồng bộ" style="background: ${c.panel}; border: 1px solid ${c.line}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
          <h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 600">Hàng đợi đồng bộ</h2>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <span style="padding: 4px 10px; border-radius: 999px; background: ${c.warnSoft}; color: ${c.warn}; font-size: 12px; font-weight: 700">Đang chạy ${nRun}</span>
            <span style="padding: 4px 10px; border-radius: 999px; background: ${c.okSoft}; color: ${c.ok}; font-size: 12px; font-weight: 700">Hoàn tất ${nOk}</span>
            <span style="padding: 4px 10px; border-radius: 999px; background: ${c.errSoft}; color: ${c.err}; font-size: 12px; font-weight: 700">Lỗi ${nErr}</span>
            <span style="padding: 4px 10px; border-radius: 999px; background: ${c.panel2}; color: ${c.muted}; font-size: 12px; font-weight: 700">Chờ ${nWait}</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
          <div style="flex: 999 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; font-size: 12.5px; color: ${c.muted}">
              <span><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: ${c.text}">${nDone} / ${state.jobs.length}</span> tập</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: ${c.text}">${pctText}</span>
            </div>
            <div aria-hidden="true" style="height: 10px; border-radius: 999px; background: ${c.track}; overflow: hidden">
              <div style="height: 100%; width: ${pctText}; background: ${c.accent}; border-radius: 999px; transition: width 0.25s ease"></div>
            </div>
          </div>
          <div style="flex: 1 1 auto; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap">
            <span style="padding: 8px 12px; border-radius: 10px; background: ${c.panel2}; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: ${c.muted}">Thời gian ${fmtTime(state.elapsed)} · ${fmtBytes(state.bytesMb)}</span>
            <span style="padding: 8px 14px; border-radius: 10px; background: ${c.accentSoft}; border: 1px solid ${c.accentLine}; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: ${c.accentText}">Tốc độ ${Number(state.speed || 0).toFixed(2)} MB/s</span>
          </div>
        </div>

        <div data-scroll-id="queue-table" class="scroll" style="overflow: auto; max-height: 312px; border: 1px solid ${c.line}; border-radius: 12px">
          <div role="table" aria-label="Chi tiết từng tập" style="min-width: 760px">
            <div role="row" style="position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: minmax(0, 2.2fr) 84px 120px minmax(0, 2fr) 160px; gap: 12px; padding: 10px 14px; background: ${c.panel2}; border-bottom: 1px solid ${c.line}; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: ${c.faint}">
              <span role="columnheader">Phim</span><span role="columnheader">Tập</span><span role="columnheader">Nguồn</span><span role="columnheader">Trạng thái</span><span role="columnheader" style="text-align: right">Dung lượng</span>
            </div>
            ${rowsHtml}
          </div>
        </div>
      </section>
    </div>
  `;

  document.querySelectorAll('[data-scroll-id]').forEach(el => {
    const id = el.getAttribute('data-scroll-id');
    if (scrollPositions[id] !== undefined) {
      el.scrollTop = scrollPositions[id];
    }
  });

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && 'setSelectionRange' in el) {
        try { el.setSelectionRange(selStart, selEnd); } catch (_) {}
      }
    }
  }
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  render();
}

function pickSeries(idx) {
  state.cur = idx;
  render();
}

function removeSeries(idx) {
  if (state.running) {
    state.notice = 'Hãy dừng đồng bộ trước khi xóa phim khỏi thư viện.';
    render();
    return;
  }
  const removed = state.series[idx];
  state.series.splice(idx, 1);
  if (state.cur >= state.series.length) {
    state.cur = Math.max(0, state.series.length - 1);
  }
  state.notice = removed ? `Đã xóa “${removed.title}” khỏi thư viện.` : 'Đã xóa phim.';
  render();
}

function clearAllSeries() {
  if (state.running) {
    state.notice = 'Hãy dừng đồng bộ trước khi xóa danh sách.';
    render();
    return;
  }
  state.series = [];
  state.cur = 0;
  state.jobs = [];
  state.urls = '';
  state.notice = 'Đã xóa toàn bộ danh sách phim.';
  render();
}

function toggleEp(epNum) {
  const cs = state.series[state.cur];
  if (!cs) return;
  if (cs.sel.has(epNum)) cs.sel.delete(epNum);
  else cs.sel.add(epNum);
  render();
}

function selectAllEps() {
  const cs = state.series[state.cur];
  if (!cs) return;
  cs.sel = new Set(cs.serials);
  render();
}

function selectNoneEps() {
  const cs = state.series[state.cur];
  if (!cs) return;
  cs.sel = new Set();
  render();
}

function invertEps() {
  const cs = state.series[state.cur];
  if (!cs) return;
  const next = new Set();
  cs.serials.forEach(n => { if (!cs.sel.has(n)) next.add(n); });
  cs.sel = next;
  render();
}

function applyRange() {
  const cs = state.series[state.cur];
  if (!cs) return;
  const picked = parseSpec(state.range, cs.serials);
  if (!picked) {
    state.notice = `Khoảng tập không hợp lệ: “${state.range}”`;
    render();
    return;
  }
  if (picked.size === 0) {
    state.notice = `Không có tập nào khớp với “${state.range}”`;
    render();
    return;
  }
  cs.sel = picked;
  state.notice = `Đã áp dụng “${state.range}” → ${picked.size} tập cho “${cs.title}”`;
  render();
}

function changeThreads(delta) {
  state.threads = Math.max(1, Math.min(32, (parseInt(state.threads, 10) || 8) + delta));
  render();
}

function setThreadsVal(val) {
  state.threads = Math.max(1, Math.min(32, parseInt(val, 10) || 8));
  render();
}

function setGlobalSubLang(langCode) {
  state.subLang = langCode || 'vi';
  state.series.forEach(s => {
    const avail = s.subLangs || [];
    if (avail.length === 0 || avail.some(x => x.code === state.subLang) || state.subLang === 'none') {
      s.subLang = state.subLang;
    }
  });
  render();
}

function setSeriesSubLang(langCode) {
  const cs = state.series[state.cur];
  if (!cs) return;
  cs.subLang = langCode || 'vi';
  render();
}

async function loadUrls() {
  const raw = state.urls.trim();
  if (!raw) {
    state.notice = 'Hãy dán ít nhất 1 link phim Phimora.com hoặc Shortical.com vào ô nhập URL!';
    render();
    return;
  }
  state.loadingMeta = true;
  state.notice = 'Đang quét metadata, tập VIP & danh sách ngôn ngữ phụ đề…';
  render();
  try {
    const res = await api('/api/load-urls', { urls: raw });
    let added = 0;
    const existingIds = new Set(state.series.map(s => s.bookId));
    (res.loaded || []).forEach(item => {
      if (existingIds.has(item.bookId)) return;
      existingIds.add(item.bookId);
      const serials = (item.serials || []).map(Number);
      const rawLangs = Array.isArray(item.sub_langs) && item.sub_langs.length ? item.sub_langs : [{ code: 'vi', name: 'Tiếng Việt (vi)' }];
      const subLangs = [...rawLangs];
      if (!subLangs.some(x => x.code === 'none')) {
        subLangs.push({ code: 'none', name: '🚫 Không tải Sub (none)' });
      }
      const pickedLang = subLangs.some(x => x.code === state.subLang)
        ? state.subLang
        : (subLangs[0] ? subLangs[0].code : 'vi');
      state.series.push({
        bookId: item.bookId,
        title: item.title,
        slug: item.slug,
        url: item.url,
        provider: item.provider || 'Phimora',
        cover_url: item.cover_url || '',
        serials: serials,
        sel: new Set(serials),
        subLangs: subLangs,
        subLang: pickedLang,
        color: state.series.length % POSTERS.length
      });
      added++;
    });
    if ((res.errors || []).length > 0) {
      state.notice = `Đã nạp thêm ${added} phim · Lỗi ${res.errors.length} link: ${res.errors[0]}`;
    } else {
      state.urls = '';
      state.notice = `Đã nạp thành công ${added} bộ phim (Tổng thư viện: ${state.series.length} bộ).`;
    }
  } catch (e) {
    state.notice = 'Lỗi kết nối Backend khi nạp URL: ' + e.message;
  } finally {
    state.loadingMeta = false;
    render();
  }
}

async function browseDir() {
  try {
    const res = await api('/api/browse-dir', { current: state.out });
    if (res.path) {
      state.out = res.path;
      await refreshLocalFolders();
      render();
    }
  } catch (e) {}
}

async function openDir() {
  try {
    await api('/api/open-dir', { path: state.out });
  } catch (e) {}
}

async function openPath(targetPath) {
  try {
    await api('/api/open-dir', { path: targetPath });
  } catch (e) {}
}

async function refreshLocalFolders() {
  try {
    const res = await api('/api/list-local-folders', { root: state.out });
    state.localFolders = res.folders || [];
    if (state.localFolders.length > 0 && !state.localFolders.some(f => f.path === state.mergeFolder)) {
      state.mergeFolder = state.localFolders[0].path;
    }
    render();
  } catch (e) {}
}

async function browseMergeFolder() {
  try {
    const res = await api('/api/browse-dir', { current: state.mergeFolder || state.out });
    if (res.path) {
      const scanRes = await api('/api/list-local-folders', { root: res.path });
      const found = scanRes.folders || [];
      found.forEach(f => {
        if (!state.localFolders.some(x => x.path === f.path)) {
          state.localFolders.unshift(f);
        }
      });
      if (found.length > 0) {
        state.mergeFolder = found[0].path;
      } else {
        state.mergeFolder = res.path;
      }
      render();
    }
  } catch (e) {}
}

async function runStandaloneMerge() {
  if (state.merging) return;
  if (!state.mergeFolder) {
    state.mergeStatus = 'Hãy chọn một thư mục phim đã tải để ghép!';
    render();
    return;
  }
  state.mergePct = 1;
  state.mergeCurSec = 0;
  state.mergeTotSec = 0;
  state.mergeSpeed = '—';
  state.mergeFps = '—';
  state.mergeSizeMb = 0;
  const res = await api('/api/run-merge', {
    folder: state.mergeFolder,
    rangeSpec: state.mergeRangeSpec,
    subMode: state.mergeSubMode,
    keepSubFiles: state.mergeKeepSub
  });
  if (!res.ok) {
    state.mergeStatus = res.error || 'Không thể bắt đầu ghép video.';
    state.mergePct = 0;
  } else {
    state.merging = true;
  }
  render();
}

async function startSync() {
  if (state.running) return;
  const payloadSeries = [];
  state.series.forEach(s => {
    const eps = Array.from(s.sel).sort((a, b) => a - b);
    if (eps.length > 0) {
      payloadSeries.push({
        bookId: s.bookId,
        title: s.title,
        provider: s.provider,
        subLang: s.subLang || state.subLang || 'vi',
        episodes: eps
      });
    }
  });
  if (payloadSeries.length === 0) {
    state.notice = 'Hãy chọn ít nhất 1 tập phim để bắt đầu đồng bộ!';
    render();
    return;
  }
  const res = await api('/api/start-sync', {
    out: state.out,
    threads: state.threads,
    mux: state.mux,
    keep: state.keep,
    merge: state.merge,
    mergeSpec: state.autoMergeSpec,
    mergeSubMode: state.autoMergeSubMode,
    series: payloadSeries
  });
  if (res.ok) {
    state.running = true;
    state.jobs = res.jobs || [];
    state.notice = `Đang đồng bộ siêu tốc ${state.jobs.length} tập với ${state.threads} luồng…`;
    render();
  } else {
    state.notice = res.error || 'Không thể bắt đầu đồng bộ.';
    render();
  }
}

async function stopSync() {
  await api('/api/stop-sync', {});
  state.notice = 'Đang gửi lệnh dừng tới các luồng tải…';
  render();
}

let prevRunning = false;
let prevMerging = false;

async function pollStatus() {
  try {
    const st = await api('/api/status');
    if (st) {
      let needFoldersRefresh = false;
      if (!state.out && st.defaultOut) {
        state.out = st.defaultOut;
        needFoldersRefresh = true;
      }
      if (prevRunning && !st.running) {
        needFoldersRefresh = true;
      }
      const changed = (
        state.running !== st.running ||
        state.merging !== st.merging ||
        state.mergeStatus !== st.mergeStatus ||
        state.mergePct !== (st.mergePct || 0) ||
        state.gpuLabel !== (st.gpuLabel || state.gpuLabel) ||
        state.mergeResults.length !== (st.mergeResults || []).length ||
        state.jobs.length !== (st.jobs || []).length ||
        state.running ||
        state.merging
      );
      prevRunning = !!st.running;
      prevMerging = !!st.merging;
      state.running = !!st.running;
      state.merging = !!st.merging;
      state.speed = st.speed || 0;
      state.bytesMb = st.bytesMb || 0;
      state.elapsed = st.elapsed || 0;
      if (st.gpuLabel) state.gpuLabel = st.gpuLabel;
      if (st.jobs) state.jobs = st.jobs;
      if (st.notice) state.notice = st.notice;
      if (st.mergeStatus) state.mergeStatus = st.mergeStatus;
      state.mergePct = st.mergePct || 0;
      state.mergeCurSec = st.mergeCurSec || 0;
      state.mergeTotSec = st.mergeTotSec || 0;
      state.mergeSpeed = st.mergeSpeed || '—';
      state.mergeFps = st.mergeFps || '—';
      state.mergeSizeMb = st.mergeSizeMb || 0;
      if (st.mergeEngine) state.mergeEngine = st.mergeEngine;
      state.mergeBatchIdx = st.mergeBatchIdx || 0;
      state.mergeBatchTotal = st.mergeBatchTotal || 0;
      if (st.mergeResults) state.mergeResults = st.mergeResults;
      if (needFoldersRefresh) {
        await refreshLocalFolders();
      } else if (changed) {
        render();
      }
    }
  } catch (_) {}
}

render();
setInterval(pollStatus, 250);
pollStatus();
</script>
</body>
</html>
